services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ${APP_DATA:-./data}:${APP_DATA_PATH:-/config}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.${APP_NAME:?APP_NAME is required}.entrypoints=websecure
      - traefik.http.routers.${APP_NAME}.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.${APP_NAME}.tls=true
      - traefik.http.routers.${APP_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.${APP_NAME}.middlewares=crowdsec@file,authentik-forward-auth@file
      - traefik.http.routers.${APP_NAME}.service=${APP_NAME}
      - traefik.http.services.${APP_NAME}.loadbalancer.server.port=${APP_PORT:?APP_PORT is required}
      - traefik.http.services.${APP_NAME}.loadbalancer.server.scheme=http

networks:
  proxy:
    external: true
